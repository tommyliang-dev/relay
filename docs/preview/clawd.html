body{margin:0;font:13px system-ui,sans-serif;color:#1f1f1f;background:#fff}h1{font-size:18px;margin:16px}h2{font-size:14px;margin:12px 16px 4px}p{margin:0 16px 8px;color:#6b6b68}

.p-clawd .run .la{animation:clawd-st .5s steps(1) infinite}

.p-clawd .run .bd{animation:clawd-bob .5s steps(1) infinite -.125s}

@keyframes clawd-tilt{20%,40%{transform:rotate(-12deg)}}
@keyframes clawd-flip{30%{transform:translateY(-5px) scaleY(-1)}60%{transform:translateY(0)}}
.p-clawd .c-light.run .la{animation-duration:.25s}

.p-clawd .c-light.run .flag{transform-origin:0 50%;animation:clawd-wave .25s steps(1) infinite}

@media (prefers-reduced-motion: reduce){.p-clawd .run,.p-clawd .run g{animation:none!important}}
